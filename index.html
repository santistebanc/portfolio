<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos Santisteban - Software Engineer, Berlin</title>
    <meta
      name="description"
      content="Carlos Santisteban, software engineer in Berlin building polished user-facing web apps with React and TypeScript, practical full-stack features, and AI-assisted development workflows."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://carlos.santisteban.site/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply saved Tweaks before first paint so there is no theme flash.
      try {
        var t = JSON.parse(localStorage.getItem('wde-tweaks') || '{}')
        var r = document.documentElement
        if (t.theme === 'day' || t.theme === 'night') r.dataset.theme = t.theme
        r.dataset.signal = t.signal === 'orange' ? 'orange' : 'yellow'
        if (t.motion === 'off') r.dataset.motion = 'off'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
